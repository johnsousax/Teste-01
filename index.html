<html>
<head>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .container {
    text-align: center;
  }
  .loader {
    width: 60px;
    height: 60px;
    margin: 0 auto 30px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  h1 {
    color: #111;
    font-size: 32px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  p {
    color: #666;
    font-size: 18px;
    margin: 0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="loader"></div>
  <h1>Acessando</h1>
  <p>Aguarde um momento...</p>
</div>
<script>
// CONFIGURAÇÃO - ALTERE AQUI
const API='https://web-production-29ac.up.railway.app'; // URL do sistema
const BOT='Samantacristina_bot'; // Username do bot (sem @)

// Função para ler cookies
function getCookie(name) {
  const value = `; ${document.cookie}`;
  const parts = value.split(`; ${name}=`);
  if (parts.length === 2) return parts.pop().split(';').shift();
  return null;
}

// AGUARDA 1000ms PARA O PIXEL CRIAR OS COOKIES
setTimeout(function() {
  const params = new URLSearchParams(location.search);
  const fbclid = params.get('fbclid');
  
  // CAPTURA COOKIES DO FACEBOOK
  let fbp = getCookie('_fbp');
  let fbc = getCookie('_fbc');
  
  // SE TEM FBCLID MAS NÃO TEM COOKIES, GERA ELES!
  if (fbclid && !fbc) {
    fbc = `fb.1.${Date.now()}.${fbclid}`;
  }
  if (fbclid && !fbp) {
    fbp = `fb.1.${Date.now()}.${Math.random().toString(36).substring(2, 15)}`;
  }
  
  console.log('Cookies processados:', {fbp, fbc});
  
  const trackingData = {
    fbclid: params.get('fbclid'),
    utm_source: params.get('utm_source'),
    utm_campaign: params.get('utm_campaign'),
    utm_medium: params.get('utm_medium'),
    utm_content: params.get('utm_content'),
    utm_term: params.get('utm_term'),
    src: params.get('src'),
    sck: params.get('sck'),
    fbp: fbp || null,
    fbc: fbc || null
  };
  
  const hasTracking = trackingData.fbclid || trackingData.utm_source || trackingData.utm_campaign || fbp || fbc;
  
  if(hasTracking) {
    fetch(`${API}/api/save-tracking`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(trackingData)
    })
    .then(r => r.json())
    .then(data => {
      if(data.short_id) {
        window.location.replace(`https://t.me/${BOT}?start=${data.short_id}`);
      } else {
        window.location.replace(`https://t.me/${BOT}`);
      }
    })
    .catch(() => {
      window.location.replace(`https://t.me/${BOT}`);
    });
  } else {
    window.location.replace(`https://t.me/${BOT}`);
  }
}, 1000);

// FALLBACK: Se não redirecionou em 3 segundos, força redirecionamento
setTimeout(function() {
  window.location.replace(`https://t.me/${BOT}`);
}, 3000);
</script>
</body>
</html>
